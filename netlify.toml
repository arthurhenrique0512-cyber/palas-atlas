[build]
  publish = "."

[functions."assets-manifest"]
  included_files = ["assets/histologia/manifest.json"]

# Catálogo Sanitizado de Lâminas (Oculta caminhos físicos brutos)
[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/assets-manifest"
  status = 200

# Emissão de Tickets Efêmeros Assinados para Lâminas DZI
[[redirects]]
  from = "/api/tile-auth"
  to = "/.netlify/functions/tile-auth"
  status = 200

# Gateway Seguro de Azulejos DZI com Rate Limiting e Anti-Scraping
[[redirects]]
  from = "/api/tile"
  to = "/.netlify/functions/tile-proxy"
  status = 200

# Redirecionamento da sincronização com Supabase
[[redirects]]
  from = "/api/sync-supabase"
  to = "/.netlify/functions/sync-supabase"
  status = 200

# BLOQUEIO DE SEGURANÇA: Proíbe download direto do manifesto bruto
[[redirects]]
  from = "/assets/histologia/manifest.json"
  to = "/404.html"
  status = 403
  force = true

# BLOQUEIO DE SEGURANÇA: Proíbe download direto de pastas de azulejos (obriga passagem por /api/tile)
[[redirects]]
  from = "/assets/histologia/*_files/*"
  to = "/404.html"
  status = 403
  force = true

# BLOQUEIO DE SEGURANÇA: Impede exposição pública de scripts internos, infraestrutura e migrações
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/firebase.json"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 403
  force = true

# BLOQUEIO DE SEGURANÇA: Estúdio de Produção de Mídia (uso local apenas)
[[redirects]]
  from = "/ANTIGRAVITY.md"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/context/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/pipelines/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/exports/*"
  to = "/404.html"
  status = 403
  force = true

# BLOQUEIO DE SEGURANÇA: Impede exposição pública de fontes Next.js e configurações de build
[[redirects]]
  from = "/app/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/components/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/camera-guide-mac/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/public/*"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/tsconfig.json"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/next.config.mjs"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/postcss.config.js"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/tailwind.config.js"
  to = "/404.html"
  status = 403
  force = true

[[redirects]]
  from = "/next-env.d.ts"
  to = "/404.html"
