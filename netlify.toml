# Cabeçalhos de segurança globais
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Cross-Origin-Resource-Policy = "same-origin"

# Lâminas Histológicas DZI (Azulejos Deep Zoom protegidos)
[[headers]]
  for = "/assets/histologia/*_files/*"
  [headers.values]
    Cache-Control = "private, no-transform, max-age=86400"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

# Manifesto de lâminas (sempre revalidar para refletir novos deploys imediatamente)
[[headers]]
  for = "/assets/histologia/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ativos estáticos gerais (imagens, fontes, áudio/vídeo)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Páginas HTML (sempre revalidar para refletir novos deploys imediatamente)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifesto PWA
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
