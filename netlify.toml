[build]
  publish = "."

# Redirecionamento da API de Assets para Serverless Function
[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/assets"
  status = 200

# Redirecionamento da sincronização com Supabase
[[redirects]]
  from = "/api/sync-supabase"
  to = "/.netlify/functions/sync-supabase"
  status = 200

# Cabeçalhos de segurança globais
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Lâminas Histológicas DZI (Azulejos Deep Zoom imutáveis)
[[headers]]
  for = "/assets/histologia/*_files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ativos estáticos gerais (imagens, fontes, áudio/vídeo)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Páginas HTML (sempre revalidar para refletir novos deploys imediatamente)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
