<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="kenhubGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="kenhubGradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="softCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Fundo Limpo e Suave (Kenhub Minimal Canvas) -->
  <rect x="15" y="15" width="510" height="390" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Blobs Circulares Orgânicos Pastéis no Fundo -->
  <circle cx="380" cy="180" r="110" fill="#f0f9ff" opacity="0.8"/>
  <circle cx="160" cy="270" r="85" fill="#fff1f2" opacity="0.7"/>

  <!-- ============================================== -->
  <!-- 1. LIVRO / ATLAS ABERTO MINIMALISTA           -->
  <!-- ============================================== -->
  <g transform="translate(110, 240)">
    <!-- Base das Páginas do Atlas -->
    <path d="M 10,65 C 80,50 140,55 160,65 C 180,55 240,50 310,65 L 310,85 C 240,70 180,75 160,85 C 140,75 80,70 10,85 Z" fill="#e2e8f0"/>
    <path d="M 10,55 C 80,40 140,45 160,55 C 180,45 240,40 310,55 L 310,75 C 240,60 180,65 160,75 C 140,65 80,60 10,75 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Linha Central da Lombada -->
    <line x1="160" y1="55" x2="160" y2="75" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Lâmina Histológica de Vidro sobre a Página -->
    <rect x="185" y="32" width="95" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" transform="rotate(-6 185 32)"/>
    <circle cx="230" cy="40" r="5" fill="#f43f5e" opacity="0.85"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. MICROSCÓPIO MINIMALISTA (TRAÇO FINO E PURO) -->
  <!-- ============================================== -->
  <g transform="translate(130, 80)" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Braço Curvo do Microscópio -->
    <path d="M 85,190 L 85,120 C 85,75 65,45 25,45 L 10,45" fill="none" stroke-width="12" stroke="#1e293b"/>
    <path d="M 85,190 L 85,120 C 85,75 65,45 25,45 L 10,45" fill="none" stroke-width="7" stroke="#ffffff"/>

    <!-- Botão de Foco -->
    <circle cx="85" cy="140" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="85" cy="140" r="5" fill="#0284c7"/>

    <!-- Ocular e Tubo -->
    <path d="M 12,45 L -10,23" fill="none" stroke-width="10" stroke="#1e293b"/>
    <path d="M 12,45 L -10,23" fill="none" stroke-width="5" stroke="#ffffff"/>
    <rect x="-22" y="10" width="10" height="16" rx="2" fill="#0f172a" transform="rotate(45 -22 10)"/>

    <!-- Objetiva apontando para a lâmina -->
    <rect x="8" y="90" width="10" height="24" rx="2" fill="#ffffff"/>
    <line x1="8" y1="102" x2="18" y2="102" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- ============================================== -->
  <!-- 3. CÉLULA HISTOLÓGICA AMPLIADA COM PIN (KENHUB)-->
  <!-- ============================================== -->
  <g transform="translate(370, 150)" filter="url(#softCardShadow)">
    <!-- Círculo de Ampliação / Foco -->
    <circle cx="0" cy="0" r="68" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="64" fill="#fff5f7"/>

    <!-- Célula 1 -->
    <path d="M -35,-20 C -20,-45 15,-40 30,-20 C 45,0 35,35 10,40 C -15,45 -35,30 -40,10 C -45,-10 -50,5 -35,-20 Z" fill="#fecdd3" stroke="#f43f5e" stroke-width="2"/>
    <!-- Núcleo de Hematoxilina -->
    <ellipse cx="-5" cy="5" rx="13" ry="16" fill="#6b21a8"/>
    <circle cx="-9" cy="0" r="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- Célula adjacente parcial -->
    <path d="M 28,-18 C 45,-30 65,-10 60,15 C 55,40 35,35 25,25 Z" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="48" cy="5" r="7" fill="#9333ea" opacity="0.8"/>
  </g>

  <!-- Linha conectando o foco do microscópio à célula ampliada -->
  <path d="M 205,215 C 260,195 285,160 305,150" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3 3"/>

  <!-- ============================================== -->
  <!-- 4. ETIQUETA INTERATIVA / CARD FLUTUANTE        -->
  <!-- ============================================== -->
  <g transform="translate(310, 245)" filter="url(#softCardShadow)">
    <rect x="0" y="0" width="165" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="10" fill="#e0f2fe"/>
    <path d="M 18,22 L 21,25 L 26,19" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
      Célula Epitelial
    </text>
    <text x="38" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="#64748b">
      Núcleo Basófilo • H&amp;E
    </text>
  </g>
</svg>
