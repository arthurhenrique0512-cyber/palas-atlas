<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Corpo Celular (Soma - Eosina Histológica Lúmina) -->
    <linearGradient id="somaGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Gradiente da Bainha de Mielina (Lipídico / Azul Óptico Lúmina) -->
    <linearGradient id="myelinGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Brilho Suave Sombra Dark -->
    <filter id="neuroShadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <radialGradient id="neuroAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aura Lúmina de Fundo (Sutil & Não Poluente) -->
  <circle cx="270" cy="200" r="180" fill="url(#neuroAmbientGlow)"/>
  <path d="M 110,180 C 80,90 180,35 300,45 C 430,55 490,150 470,260 C 450,350 340,380 230,365 C 130,350 130,260 110,180 Z" fill="#38bdf8" fill-opacity="0.04" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ============================================== -->
  <!-- NEURÔNIO MULTIPOLAR (TEMA ESCURO - PALAS ATLAS)-->
  <!-- ============================================== -->
  <g id="neuronBodyDark" transform="translate(40, 50)" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- DENDRITOS RAMIFICADOS (TRAÇOS ORGÂNICOS ILUMINADOS) -->
    <!-- Ramo Superior -->
    <path d="M 125,120 C 115,80 100,50 80,30 M 100,50 L 120,35 M 80,30 L 65,20" fill="none" stroke="#e2e8f0"/>
    <path d="M 145,110 C 150,70 170,40 190,20 M 170,45 L 185,55" fill="none" stroke="#e2e8f0"/>
    <!-- Ramo Esquerdo -->
    <path d="M 105,145 C 70,140 40,130 15,115 M 45,135 L 30,150" fill="none" stroke="#e2e8f0"/>
    <!-- Ramo Inferior -->
    <path d="M 115,185 C 90,210 65,240 40,265 M 70,230 L 85,255" fill="none" stroke="#e2e8f0"/>

    <!-- CORPO CELULAR (SOMA) -->
    <path d="M 105,145 C 110,120 135,110 155,125 C 175,140 180,165 170,185 C 160,205 130,210 115,185 C 100,165 100,155 105,145 Z" fill="url(#somaGradDark)" filter="url(#neuroShadowDark)"/>

    <!-- NÚCLEO EUCROMÁTICO COM NUCLÉOLO PROEMINENTE -->
    <circle cx="140" cy="160" r="18" fill="#ffffff" stroke="#c084fc" stroke-width="2"/>
    <circle cx="140" cy="160" r="7" fill="#6b21a8"/>
    <circle cx="138" cy="158" r="2" fill="#ffffff"/>

    <!-- CONE AXONAL & AXÔNIO -->
    <path d="M 175,160 C 210,165 240,160 270,160 C 310,160 340,165 375,160" fill="none" stroke="#f472b6" stroke-width="4"/>

    <!-- BAINHA DE MIELINA (SEGMENTOS CIANO LÚMINA) -->
    <!-- Segmento 1 -->
    <rect x="195" y="146" width="38" height="28" rx="8" fill="url(#myelinGradDark)" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="214" cy="160" r="3.5" fill="#ffffff"/>
    <!-- Segmento 2 -->
    <rect x="245" y="146" width="38" height="28" rx="8" fill="url(#myelinGradDark)" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="264" cy="160" r="3.5" fill="#ffffff"/>
    <!-- Segmento 3 -->
    <rect x="295" y="146" width="38" height="28" rx="8" fill="url(#myelinGradDark)" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="314" cy="160" r="3.5" fill="#ffffff"/>

    <!-- Nódulos de Ranvier -->
    <line x1="239" y1="152" x2="239" y2="168" stroke="#fb7185" stroke-width="2.5"/>
    <line x1="289" y1="152" x2="289" y2="168" stroke="#fb7185" stroke-width="2.5"/>

    <!-- TERMINAL AXONAL & BOTÕES SINÁPTICOS -->
    <path d="M 333,160 C 355,160 375,145 395,130" fill="none" stroke="#e2e8f0"/>
    <circle cx="398" cy="128" r="6" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>

    <path d="M 333,160 C 360,160 380,175 405,190" fill="none" stroke="#e2e8f0"/>
    <circle cx="408" cy="192" r="6" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Vesículas de Neurotransmissores Flutuando na Fenda Sináptica -->
    <g fill="#38bdf8" stroke="none">
      <circle cx="415" cy="125" r="2.5"/>
      <circle cx="423" cy="129" r="2"/>
      <circle cx="418" cy="135" r="2.2"/>
      <circle cx="425" cy="188" r="2.5"/>
      <circle cx="432" cy="194" r="2"/>
      <circle cx="424" cy="200" r="2.2"/>
    </g>

    <!-- Membrana Pós-Sináptica / Receptores Dendríticos -->
    <path d="M 436,110 C 441,130 441,150 436,170" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="4 2"/>
  </g>

  <!-- ============================================== -->
  <!-- CARD FLUTUANTE ESTILO KENHUB (TEMA DARK PALAS) -->
  <!-- ============================================== -->
  <g transform="translate(255, 295)" filter="url(#neuroShadowDark)">
    <!-- Fundo do Card Ônix com Borda Dourada Sutil -->
    <rect x="0" y="0" width="230" height="54" rx="12" fill="#121216" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="14" fill="rgba(212, 175, 55, 0.12)"/>
    <!-- Ícone de Impulso / Raio Dourado -->
    <path d="M 28,19 L 24,27 L 31,27 L 27,35" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="52" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f4f2ed">
      Neurônio Multipolar
    </text>
    <text x="52" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#a1a1aa">
      Soma, Bainha de Mielina &amp; Sinapse
    </text>
  </g>
</svg>