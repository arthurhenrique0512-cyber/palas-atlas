<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <defs>
    <!-- Gradientes Suaves e Limpos (Paleta Nobre: Ouro Champanhe, Azul Petróleo & Slate) -->
    <linearGradient id="owlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <linearGradient id="owlTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <radialGradient id="cornerAura" cx="75%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pupilGaze" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <filter id="cleanShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Aura Difusa Suave no Canto -->
  <rect width="520" height="520" fill="url(#cornerAura)" pointer-events="none"/>

  <!-- Arcos Circulares Minimalistas (Apenas 2 linhas ultra-limpas, sem poluição) -->
  <g opacity="0.45" stroke-linecap="round" pointer-events="none">
    <circle cx="380" cy="140" r="190" fill="none" stroke="url(#owlTeal)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="380" cy="140" r="230" fill="none" stroke="url(#owlGold)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ============================================== -->
  <!-- A CORUJA DE PALAS MINIMALISTA (ESTILO KENHUB)  -->
  <!-- Traços nítidos de 2.5px, contornos arredondados -->
  <!-- ============================================== -->
  <g id="pallasOwlFigure" transform="translate(320, 70)" filter="url(#cleanShadow)" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Halo Suave atrás da Coruja -->
    <ellipse cx="60" cy="90" rx="95" ry="95" fill="#f0f9ff" fill-opacity="0.5" stroke="none"/>

    <!-- ASAS CURVADAS ELEGANTES (Tons Azul Petróleo) -->
    <!-- Asa Esquerda -->
    <path d="M 15,95 C -15,115 -25,160 -10,195 C 10,215 35,210 50,190 C 35,165 30,125 40,95 Z" 
          fill="url(#owlTeal)"/>
    <path d="M -5,145 C 5,165 20,185 40,190" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Asa Direita (Espelhada) -->
    <path d="M 105,95 C 135,115 145,160 130,195 C 110,215 85,210 70,190 C 85,165 90,125 80,95 Z" 
          fill="url(#owlTeal)"/>
    <path d="M 125,145 C 115,165 100,185 80,190" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- CORPO / PEITORAL DA CORUJA -->
    <path d="M 35,80 C 15,110 20,175 40,200 C 50,210 70,210 80,200 C 100,175 105,110 85,80 Z" 
          fill="#ffffff"/>

    <!-- Penas do Peito em Formato de Meia-Lua Suave -->
    <g stroke="url(#owlGold)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M 48,125 C 55,133 65,133 72,125"/>
      <path d="M 42,145 C 50,153 60,153 68,145"/>
      <path d="M 54,145 C 62,153 72,153 78,145"/>
      <path d="M 48,165 C 55,173 65,173 72,165"/>
    </g>

    <!-- CABEÇA DA CORUJA & ORELHAS/PLUMAS AURICULARES -->
    <!-- Formato da Cabeça com Plumas Pontiagudas -->
    <path d="M 15,25 L 35,45 C 50,40 70,40 85,45 L 105,25 C 108,55 100,75 100,85 C 85,95 35,95 20,85 C 20,75 12,55 15,25 Z" 
          fill="#ffffff"/>

    <!-- Disco Facial com Contorno Dourado -->
    <path d="M 28,48 C 45,43 60,52 60,58 C 60,52 75,43 92,48 C 102,68 95,85 85,88 C 68,88 60,78 60,78 C 60,78 52,88 35,88 C 25,85 18,68 28,48 Z" 
          fill="#fefce8" stroke="url(#owlGold)" stroke-width="2"/>

    <!-- SOBRANCELHA ATENIENSE EM V -->
    <path d="M 28,48 L 60,60 L 92,48" fill="none" stroke="url(#owlGold)" stroke-width="3"/>

    <!-- ============================================ -->
    <!-- OLHOS DA CORUJA (MARCANTES, SÁBIOS & LIMPOS) -->
    <!-- ============================================ -->
    <!-- Olho Esquerdo -->
    <g transform="translate(44, 66)">
      <!-- Anel Dourado da Ocular -->
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#owlGold)" stroke-width="2.5"/>
      <!-- Íris Azul Petróleo com Foco -->
      <circle cx="0" cy="0" r="10" fill="url(#pupilGaze)"/>
      <!-- Pupila -->
      <circle cx="0" cy="0" r="4.5" fill="#0f172a"/>
      <!-- Brilho Especular Duplo -->
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff"/>
      <circle cx="2" cy="2" r="1" fill="#ffffff"/>
    </g>

    <!-- Olho Direito -->
    <g transform="translate(76, 66)">
      <!-- Anel Dourado da Ocular -->
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#owlGold)" stroke-width="2.5"/>
      <!-- Íris Azul Petróleo com Foco -->
      <circle cx="0" cy="0" r="10" fill="url(#pupilGaze)"/>
      <!-- Pupila -->
      <circle cx="0" cy="0" r="4.5" fill="#0f172a"/>
      <!-- Brilho Especular Duplo -->
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff"/>
      <circle cx="2" cy="2" r="1" fill="#ffffff"/>
    </g>

    <!-- Bico Pequeno Triangular Dourado -->
    <polygon points="60,65 65,77 60,82 55,77" fill="url(#owlGold)" stroke="#78350f" stroke-width="1"/>

    <!-- ============================================ -->
    <!-- POLEIRO: RAMO DE OLIVEIRA / LÂMINA ELEGANTE  -->
    <!-- ============================================ -->
    <!-- Ramo Horizontal Fino onde a Coruja Pousa -->
    <path d="M -30,205 C 10,202 70,202 150,205" fill="none" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Garrinhas Douradas Segurando o Ramo -->
    <g fill="none" stroke="url(#owlGold)" stroke-width="2.5">
      <path d="M 44,198 L 44,206 M 48,198 L 48,206 M 52,198 L 52,206"/>
      <path d="M 68,198 L 68,206 M 72,198 L 72,206 M 76,198 L 76,206"/>
    </g>

    <!-- Folhinhas de Oliveira / Louro de Palas Atena -->
    <g fill="url(#owlGold)" stroke="#1e293b" stroke-width="1.8">
      <!-- Folha 1 -->
      <path d="M -15,204 C -25,195 -35,200 -40,208 C -30,212 -20,210 -15,204 Z"/>
      <!-- Folha 2 -->
      <path d="M 0,203 C 5,190 -5,182 -12,185 C -15,195 -8,202 0,203 Z"/>
      <!-- Folha 3 (Direita) -->
      <path d="M 135,205 C 145,195 155,198 160,206 C 150,212 140,210 135,205 Z"/>
    </g>

    <!-- Estrela / Brilho Discreto da Sabedoria (✦) -->
    <path d="M -15,70 Q -15,80 -25,80 Q -15,80 -15,90 Q -15,80 -5,80 Q -15,80 -15,70 Z" 
          fill="url(#owlGold)" stroke="none" opacity="0.75"/>
  </g>
</svg>
