<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <!-- Gradientes Suaves e Limpos (Estilo Kenhub / Medical Minimalist) -->
    <linearGradient id="kenhubSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="softGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="blobGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Sombra Suave Kenhub (Card Shadow) -->
    <filter id="kenhubShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. FUNDO ORGÂNICO MINIMALISTA (BLOB KENHUB)   -->
  <!-- ============================================== -->
  <g id="backgroundAesthetic">
    <!-- Forma Orgânica Pastel (Kenhub Backdrop) -->
    <path d="M 120,240 C 90,140 180,60 300,50 C 430,40 540,110 570,220 C 600,340 510,430 380,440 C 240,450 140,350 120,240 Z" fill="url(#blobGlow)"/>

    <!-- Grade Fina de Pontos (Sutil Alinhamento Científico) -->
    <g fill="#94a3b8" opacity="0.35">
      <circle cx="80" cy="100" r="2"/><circle cx="110" cy="100" r="2"/><circle cx="140" cy="100" r="2"/>
      <circle cx="80" cy="130" r="2"/><circle cx="110" cy="130" r="2"/><circle cx="140" cy="130" r="2"/>
      <circle cx="80" cy="160" r="2"/><circle cx="110" cy="160" r="2"/><circle cx="140" cy="160" r="2"/>
      
      <circle cx="510" cy="340" r="2"/><circle cx="540" cy="340" r="2"/><circle cx="570" cy="340" r="2"/>
      <circle cx="510" cy="370" r="2"/><circle cx="540" cy="370" r="2"/><circle cx="570" cy="370" r="2"/>
      <circle cx="510" cy="400" r="2"/><circle cx="540" cy="400" r="2"/><circle cx="570" cy="400" r="2"/>
    </g>

    <!-- Círculos de Órbita / Halos Flutuantes -->
    <circle cx="490" cy="120" r="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="130" cy="380" r="22" fill="#fb7185" fill-opacity="0.12"/>
    <circle cx="130" cy="380" r="10" fill="#fb7185" fill-opacity="0.25"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. MICROSCÓPIO MINIMALISTA FLAT               -->
  <!-- Linhas limpas, espessura uniforme de 2.5px    -->
  <!-- ============================================== -->
  <g id="microscopeClean" transform="translate(140, 100)" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Base Sólida e Estável -->
    <path d="M 20,290 C 20,270 40,265 65,265 L 145,265 C 170,265 190,270 190,290 L 200,295 C 200,302 195,305 185,305 L 25,305 C 15,305 10,302 10,295 Z" fill="#ffffff" filter="url(#kenhubShadow)"/>
    <line x1="45" y1="305" x2="60" y2="305" stroke="#0284c7" stroke-width="3"/>
    <line x1="150" y1="305" x2="165" y2="305" stroke="#0284c7" stroke-width="3"/>

    <!-- Coluna / Braço Curvo do Microscópio -->
    <path d="M 155,265 L 155,160 C 155,95 125,50 65,50 L 50,50" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="square"/>
    <path d="M 155,265 L 155,160 C 155,95 125,50 65,50 L 50,50" fill="none" stroke="#f1f5f9" stroke-width="11" stroke-linecap="square"/>

    <!-- Parafuso Micrométrico / Ajuste de Foco -->
    <circle cx="155" cy="195" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="155" cy="195" r="9" fill="#0284c7" stroke="#1e293b" stroke-width="2"/>
    <circle cx="155" cy="195" r="3" fill="#ffffff"/>

    <!-- Platina (Mesa da Lâmina) -->
    <path d="M 15,185 L 125,185 L 125,195 L 15,195 Z" fill="#0f172a"/>
    <!-- Presilha Metálica da Lâmina -->
    <path d="M 25,185 L 35,178 L 50,178" fill="none" stroke="#0284c7" stroke-width="2"/>

    <!-- Lâmina de Vidro com Espécime Histológico H&E -->
    <rect x="30" y="179" width="65" height="6" rx="1.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <!-- Mancha H&E rosa/roxa na lâmina -->
    <ellipse cx="62" cy="182" rx="10" ry="2" fill="#f43f5e" opacity="0.85"/>

    <!-- Fonte de Luz Sub-platina (Condensador) -->
    <path d="M 45,215 L 80,215 L 72,240 L 53,240 Z" fill="#e2e8f0"/>
    <path d="M 53,215 C 53,205 72,205 72,215" fill="#38bdf8" fill-opacity="0.3"/>

    <!-- Revólver & Objetivas -->
    <path d="M 48,110 L 78,110 L 73,125 L 53,125 Z" fill="#334155"/>
    <!-- Objetiva 1 (Focalizando a lâmina) -->
    <rect x="56" y="125" width="13" height="28" rx="2" fill="#ffffff"/>
    <rect x="56" y="138" width="13" height="4" fill="#0284c7"/>
    <!-- Objetiva 2 (Secundária em ângulo) -->
    <path d="M 70,123 L 86,138 L 78,146 L 65,128 Z" fill="#e2e8f0"/>
    <line x1="78" y1="131" x2="84" y2="137" stroke="#f59e0b" stroke-width="2"/>

    <!-- Tubo Óptico Inclinado e Ocular -->
    <path d="M 50,50 L 15,15" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    <path d="M 50,50 L 15,15" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <!-- Ocular (Onde o estudante/pesquisador olha) -->
    <path d="M 22,8 L 4,-10 L -6,0 L 12,18 Z" fill="#0f172a"/>
    <ellipse cx="-1" cy="-5" rx="7" ry="3" transform="rotate(-45 -1 -5)" fill="#38bdf8"/>
  </g>

  <!-- ============================================== -->
  <!-- 3. LENTE CIRCULAR DE ZOOM (ESTILO KENHUB)      -->
  <!-- Mostra a estrutura histológica simplificada   -->
  <!-- ============================================== -->
  <!-- Linha Conectora Pontilhada da Lâmina até a Lupa -->
  <path d="M 202,282 C 240,282 270,260 300,240" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <g id="kenhubZoomWindow" transform="translate(340, 90)">
    
    <!-- Sombra e Círculo Base da Lente -->
    <circle cx="100" cy="100" r="95" fill="url(#softGlass)" filter="url(#kenhubShadow)"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="100" cy="100" r="92" fill="#fff5f7"/> <!-- Fundo sutilmente róseo de Eosina -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- ============================================ -->
    <!-- CÉLULAS HISTOLÓGICAS MINIMALISTAS (H&E CLEAN)-->
    <!-- Formas arredondadas e amigáveis estilo Kenhub-->
    <!-- ============================================ -->
    <g id="simpleCells" clip-path="url(#circleClip)">
      <clipPath id="circleClip">
        <circle cx="100" cy="100" r="91"/>
      </clipPath>

      <!-- Fita de Células Epiteliais Simples -->
      <!-- Célula 1 -->
      <path d="M 30,55 C 55,45 75,55 75,85 C 75,115 50,120 30,110 C 15,100 15,70 30,55 Z" fill="#fecdd3" stroke="#f43f5e" stroke-width="1.8"/>
      <ellipse cx="46" cy="84" rx="10" ry="13" fill="#7e22ce" opacity="0.9"/>
      <circle cx="43" cy="80" r="2.5" fill="#ffffff" opacity="0.8"/>

      <!-- Célula 2 (Central em Destaque) -->
      <path d="M 75,85 C 75,55 115,50 135,75 C 155,100 135,135 105,135 C 75,135 75,115 75,85 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2"/>
      <ellipse cx="108" cy="95" rx="13" ry="16" fill="#6b21a8"/>
      <circle cx="104" cy="90" r="3.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="112" cy="102" r="2" fill="#3b0764"/>

      <!-- Célula 3 -->
      <path d="M 135,75 C 155,50 185,65 185,95 C 185,125 155,135 135,130 C 120,115 125,90 135,75 Z" fill="#fecdd3" stroke="#f43f5e" stroke-width="1.8"/>
      <ellipse cx="160" cy="96" rx="9" ry="12" fill="#7e22ce" opacity="0.9"/>
      <circle cx="158" cy="93" r="2" fill="#ffffff" opacity="0.8"/>

      <!-- Célula 4 (Inferior) -->
      <path d="M 50,125 C 80,125 95,150 85,175 C 75,195 45,190 35,170 C 25,145 35,125 50,125 Z" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5"/>
      <ellipse cx="60" cy="158" rx="8" ry="10" fill="#9333ea" opacity="0.85"/>
      <circle cx="58" cy="155" r="1.8" fill="#ffffff"/>

      <!-- Célula 5 (Inferior Direita) -->
      <path d="M 105,135 C 135,135 155,155 145,180 C 135,200 105,195 95,175 C 85,155 95,135 105,135 Z" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5"/>
      <ellipse cx="122" cy="164" rx="9" ry="11" fill="#9333ea" opacity="0.85"/>
      <circle cx="120" cy="161" r="2" fill="#ffffff"/>

      <!-- Feixes de Colágeno Delicados no Fundo -->
      <path d="M 10,145 Q 60,130 110,150 T 190,140" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
      <path d="M 10,40 Q 80,25 140,45" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
    </g>

    <!-- Borda Externa em Destaque Azul Petróleo (Ocular Frame) -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="url(#kenhubSky)" stroke-width="3"/>
    
    <!-- Reflexo de Vidro Curvo Minimalista -->
    <path d="M 40,35 C 80,15 130,20 160,45 C 145,35 95,30 55,48 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- ============================================== -->
  <!-- 4. CARDS & ETIQUETAS FLUTUANTES (ESTILO KENHUB)-->
  <!-- ============================================== -->
  
  <!-- Card Principal: "Epitélio Simples" com Pin -->
  <g id="kenhubCard1" transform="translate(380, 290)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="180" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <!-- Ícone Circular de Destaque -->
    <circle cx="26" cy="26" r="14" fill="#eff6ff"/>
    <path d="M 21,26 L 24,29 L 31,22" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tipografia Limpa e Hierarquizada -->
    <text x="48" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="-0.01em">
      Tecido Epitelial
    </text>
    <text x="48" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
      Coloração H&amp;E • Núcleo Basal
    </text>
  </g>

  <!-- Badge 2: "Zoom 400x Óptico" -->
  <g id="kenhubBadge2" transform="translate(315, 80)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="76" height="28" rx="14" fill="#0f172a"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="24" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      400X
    </text>
  </g>

  <!-- Cursor / Pin de Foco Interativo Apontando para a Célula -->
  <g id="interactivePointer" transform="translate(485, 205)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" fill-opacity="0.15"/>
    <circle cx="0" cy="0" r="6" fill="#0284c7"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    <!-- Linha indicadora fina -->
    <line x1="0" y1="0" x2="25" y2="25" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</svg>
