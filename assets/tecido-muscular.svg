<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="muscleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="muscleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="50%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <filter id="muscleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fundo Orgânico Suave -->
  <path d="M 110,210 C 80,100 170,40 300,50 C 430,60 490,140 480,260 C 470,360 360,400 230,390 C 130,370 120,290 110,210 Z" fill="#fff1f2" fill-opacity="0.65"/>
  <circle cx="430" cy="110" r="30" fill="#e0f2fe" opacity="0.6"/>

  <!-- ============================================== -->
  <!-- TECIDO MUSCULAR ESTRIADO ESQUELÉTICO (KENHUB)  -->
  <!-- ============================================== -->
  <g transform="translate(80, 80)" filter="url(#muscleShadow)" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- FIBRA MUSCULAR 1 (SUPERIOR) -->
    <g>
      <rect x="0" y="20" width="360" height="52" rx="10" fill="url(#muscleGrad1)"/>
      <!-- Estriações Transversais (Bandas Claras e Escuras I e A) -->
      <g stroke="#be123c" stroke-width="2" opacity="0.4" stroke-dasharray="0">
        <line x1="40" y1="21" x2="40" y2="71"/><line x1="55" y1="21" x2="55" y2="71"/>
        <line x1="70" y1="21" x2="70" y2="71"/><line x1="85" y1="21" x2="85" y2="71"/>
        <line x1="100" y1="21" x2="100" y2="71"/><line x1="115" y1="21" x2="115" y2="71"/>
        <line x1="130" y1="21" x2="130" y2="71"/><line x1="145" y1="21" x2="145" y2="71"/>
        <line x1="160" y1="21" x2="160" y2="71"/><line x1="175" y1="21" x2="175" y2="71"/>
        <line x1="190" y1="21" x2="190" y2="71"/><line x1="205" y1="21" x2="205" y2="71"/>
        <line x1="220" y1="21" x2="220" y2="71"/><line x1="235" y1="21" x2="235" y2="71"/>
        <line x1="250" y1="21" x2="250" y2="71"/><line x1="265" y1="21" x2="265" y2="71"/>
        <line x1="280" y1="21" x2="280" y2="71"/><line x1="295" y1="21" x2="295" y2="71"/>
        <line x1="310" y1="21" x2="310" y2="71"/><line x1="325" y1="21" x2="325" y2="71"/>
      </g>
      <!-- Núcleos Periféricos Multinucleados (Achatados junto ao Sarcolema) -->
      <ellipse cx="65" cy="22" rx="15" ry="6" fill="#6b21a8" stroke="#1e293b" stroke-width="2"/>
      <ellipse cx="215" cy="70" rx="16" ry="6" fill="#6b21a8" stroke="#1e293b" stroke-width="2"/>
      <ellipse cx="310" cy="22" rx="14" ry="5.5" fill="#6b21a8" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- FIBRA MUSCULAR 2 (INTERMEDIÁRIA) -->
    <g>
      <rect x="0" y="85" width="360" height="52" rx="10" fill="url(#muscleGrad2)"/>
      <!-- Estriações Transversais -->
      <g stroke="#be123c" stroke-width="2" opacity="0.4">
        <line x1="35" y1="86" x2="35" y2="136"/><line x1="50" y1="86" x2="50" y2="136"/>
        <line x1="65" y1="86" x2="65" y2="136"/><line x1="80" y1="86" x2="80" y2="136"/>
        <line x1="95" y1="86" x2="95" y2="136"/><line x1="110" y1="86" x2="110" y2="136"/>
        <line x1="125" y1="86" x2="125" y2="136"/><line x1="140" y1="86" x2="140" y2="136"/>
        <line x1="155" y1="86" x2="155" y2="136"/><line x1="170" y1="86" x2="170" y2="136"/>
        <line x1="185" y1="86" x2="185" y2="136"/><line x1="200" y1="86" x2="200" y2="136"/>
        <line x1="215" y1="86" x2="215" y2="136"/><line x1="230" y1="86" x2="230" y2="136"/>
        <line x1="245" y1="86" x2="245" y2="136"/><line x1="260" y1="86" x2="260" y2="136"/>
        <line x1="275" y1="86" x2="275" y2="136"/><line x1="290" y1="86" x2="290" y2="136"/>
        <line x1="305" y1="86" x2="305" y2="136"/><line x1="320" y1="86" x2="320" y2="136"/>
      </g>
      <!-- Núcleos Periféricos -->
      <ellipse cx="130" cy="86" rx="16" ry="6" fill="#7e22ce" stroke="#1e293b" stroke-width="2"/>
      <ellipse cx="260" cy="135" rx="15" ry="6" fill="#7e22ce" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- FIBRA MUSCULAR 3 (INFERIOR) -->
    <g>
      <rect x="0" y="150" width="360" height="52" rx="10" fill="url(#muscleGrad1)"/>
      <!-- Estriações Transversais -->
      <g stroke="#be123c" stroke-width="2" opacity="0.4">
        <line x1="40" y1="151" x2="40" y2="201"/><line x1="55" y1="151" x2="55" y2="201"/>
        <line x1="70" y1="151" x2="70" y2="201"/><line x1="85" y1="151" x2="85" y2="201"/>
        <line x1="100" y1="151" x2="100" y2="201"/><line x1="115" y1="151" x2="115" y2="201"/>
        <line x1="130" y1="151" x2="130" y2="201"/><line x1="145" y1="151" x2="145" y2="201"/>
        <line x1="160" y1="151" x2="160" y2="201"/><line x1="175" y1="151" x2="175" y2="201"/>
        <line x1="190" y1="151" x2="190" y2="201"/><line x1="205" y1="151" x2="205" y2="201"/>
        <line x1="220" y1="151" x2="220" y2="201"/><line x1="235" y1="151" x2="235" y2="201"/>
        <line x1="250" y1="151" x2="250" y2="201"/><line x1="265" y1="151" x2="265" y2="201"/>
        <line x1="280" y1="151" x2="280" y2="201"/><line x1="295" y1="151" x2="295" y2="201"/>
      </g>
      <!-- Núcleos Periféricos -->
      <ellipse cx="80" cy="201" rx="15" ry="6" fill="#6b21a8" stroke="#1e293b" stroke-width="2"/>
      <ellipse cx="200" cy="151" rx="16" ry="6" fill="#6b21a8" stroke="#1e293b" stroke-width="2"/>
      <ellipse cx="330" cy="201" rx="14" ry="5.5" fill="#6b21a8" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- PLACA MOTORA / JUNÇÃO NEUROMUSCULAR -->
    <!-- Terminação Nervosa Motora Inervando a Fibra -->
    <path d="M 270,-10 C 275,15 285,30 295,45" fill="none" stroke="#0284c7" stroke-width="3"/>
    <circle cx="295" cy="45" r="7" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
    <path d="M 285,30 C 300,32 315,35 325,48" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="325" cy="48" r="6" fill="#38bdf8" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- ============================================== -->
  <!-- CARD FLUTUANTE ESTILO KENHUB                   -->
  <!-- ============================================== -->
  <g transform="translate(150, 315)" filter="url(#muscleShadow)">
    <rect x="0" y="0" width="240" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="14" fill="#fff1f2"/>
    <!-- Ícone de Músculo / Fibra -->
    <path d="M 22,26 L 34,26 M 25,22 L 31,22 M 25,30 L 31,30" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    
    <text x="52" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">
      Músculo Esquelético
    </text>
    <text x="52" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">
      Estriações, Núcleos &amp; Placa Motora
    </text>
  </g>
</svg>
