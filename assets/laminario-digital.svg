<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="tabScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="kenhubBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="tabShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="badgeShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fundo Orgânico Suave -->
  <path d="M 80,210 C 60,90 160,40 280,50 C 410,60 480,120 490,240 C 500,350 400,410 270,390 C 150,370 100,310 80,210 Z" fill="#e0f2fe" fill-opacity="0.45"/>

  <!-- ============================================== -->
  <!-- TABLET / TELA DE MICROSCOPIA DIGITAL          -->
  <!-- ============================================== -->
  <g transform="translate(100, 65)" filter="url(#tabShadow)">
    <!-- Moldura Externa do Tablet -->
    <rect x="0" y="0" width="340" height="245" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Câmera Frontal / Sensor -->
    <circle cx="170" cy="9" r="2.5" fill="#334155"/>

    <!-- Tela do Visualizador de Lâminas -->
    <rect x="12" y="18" width="316" height="210" rx="10" fill="url(#tabScreen)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Interface Superior do Microscópio Virtual (Barra de Ferramentas) -->
    <rect x="12" y="18" width="316" height="28" rx="0" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Controles da Janela -->
    <circle cx="28" cy="32" r="3.5" fill="#f43f5e"/>
    <circle cx="40" cy="32" r="3.5" fill="#f59e0b"/>
    <circle cx="52" cy="32" r="3.5" fill="#10b981"/>
    <!-- Nome da Lâmina no Topo -->
    <text x="170" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#475569">
      Lâmina #04 • Corte Histológico H&amp;E
    </text>

    <!-- ÁREA DE NAVEGAÇÃO DA LÂMINA VIRTUAL -->
    <g transform="translate(12, 46)">
      <!-- Fundo de Tecido Conjuntivo & Fibras -->
      <rect width="316" height="182" fill="#fff5f7"/>

      <!-- Estruturas Celulares Navegáveis -->
      <!-- Agrupamento de Células Glandulares/Epiteliais -->
      <g stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round">
        <path d="M 60,60 C 85,50 110,65 105,95 C 100,120 70,125 50,110 C 35,95 40,70 60,60 Z" fill="#fecdd3"/>
        <ellipse cx="74" cy="88" rx="10" ry="13" fill="#6b21a8"/>
        <circle cx="71" cy="84" r="2.5" fill="#ffffff"/>

        <path d="M 105,95 C 130,85 155,100 150,130 C 145,155 115,160 95,145 C 80,130 85,105 105,95 Z" fill="#fda4af"/>
        <ellipse cx="120" cy="125" rx="11" ry="14" fill="#7e22ce"/>
        <circle cx="117" cy="121" r="2.5" fill="#ffffff"/>

        <path d="M 150,60 C 175,50 200,65 195,95 C 190,120 160,125 140,110 C 125,95 130,70 150,60 Z" fill="#fecdd3"/>
        <ellipse cx="166" cy="88" rx="9" ry="12" fill="#6b21a8"/>
        <circle cx="164" cy="85" r="2" fill="#ffffff"/>

        <!-- Tubo / Vaso Sanguíneo em Corte -->
        <ellipse cx="235" cy="115" rx="35" ry="22" fill="#ffe4e6" stroke="#fb7185" stroke-dasharray="4 2"/>
        <ellipse cx="225" cy="112" rx="7" ry="5" fill="#e11d48"/>
        <ellipse cx="245" cy="118" rx="7" ry="5" fill="#e11d48"/>
      </g>

      <!-- Retículo de Foco & Mira Óptica -->
      <g stroke="#0284c7" stroke-width="1" opacity="0.6">
        <circle cx="120" cy="125" r="32" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/>
        <line x1="82" y1="125" x2="98" y2="125"/>
        <line x1="142" y1="125" x2="158" y2="125"/>
        <line x1="120" y1="87" x2="120" y2="103"/>
        <line x1="120" y1="147" x2="120" y2="163"/>
      </g>

      <!-- Barra de Controle de Zoom Flutuante (Kenhub UI) -->
      <g transform="translate(265, 105)">
        <rect x="0" y="0" width="36" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#badgeShadow2)"/>
        <!-- Botão + -->
        <text x="18" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">+</text>
        <line x1="6" y1="33" x2="30" y2="33" stroke="#e2e8f0" stroke-width="1"/>
        <!-- Botão - -->
        <text x="18" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">−</text>
      </g>

      <!-- Mini Escala Micrométrica no Canto -->
      <g transform="translate(15, 155)">
        <rect x="0" y="0" width="55" height="16" rx="4" fill="#0f172a" fill-opacity="0.8"/>
        <line x1="6" y1="9" x2="36" y2="9" stroke="#ffffff" stroke-width="1.5"/>
        <text x="44" y="12" font-family="monospace" font-size="7" font-weight="700" fill="#ffffff">50µm</text>
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- CARD FLUTUANTE ESTILO KENHUB                   -->
  <!-- ============================================== -->
  <g transform="translate(290, 310)" filter="url(#badgeShadow2)">
    <rect x="0" y="0" width="195" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="14" fill="#eff6ff"/>
    <!-- Ícone de Lupa / Microscópio -->
    <path d="M 23,26 A 5,5 0 1,1 33,26 A 5,5 0 1,1 23,26 M 31,30 L 35,34" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    
    <text x="50" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">
      Microscópio Virtual
    </text>
    <text x="50" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">
      Zoom Contínuo 40X a 1000X
    </text>
  </g>
</svg>
