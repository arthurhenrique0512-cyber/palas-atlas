<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="crestBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- OPÇÃO B: BRASÃO MONOGRAMA GEOMÉTRICO (CLEAN)   -->
  <!-- ============================================== -->
  <g transform="translate(330, 80)" filter="url(#crestShadow)">
    
    <!-- Escudo / Brasão Translúcido de Fundo -->
    <path d="M 0,20 L 70,20 C 130,20 145,75 145,130 C 145,190 85,240 0,265 C -85,240 -145,190 -145,130 C -145,75 -130,20 -70,20 Z" 
          fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Bordas Internas em Ouro Nobre -->
    <path d="M 0,35 L 55,35 C 105,35 125,75 125,125 C 125,175 75,215 0,240 C -75,215 -125,175 -125,125 C -125,75 -105,35 -55,35 Z" 
          fill="none" stroke="url(#crestGold)" stroke-width="1.8"/>

    <!-- A CORUJA GEOMÉTRICA DE PALAS (TRAÇOS CONTÍNUOS) -->
    <g stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Cabeça & Orelhas Facetadas -->
      <path d="M -30,65 L -15,40 L 0,55 L 15,40 L 30,65" fill="none" stroke="url(#crestGold)" stroke-width="3"/>
      
      <!-- Contorno Facial da Coruja -->
      <path d="M -35,70 C -45,95 -25,120 0,120 C 25,120 45,95 35,70" fill="#f8fafc"/>

      <!-- Olhos da Coruja (Oculares de Precisão) -->
      <circle cx="-16" cy="88" r="11" fill="#0f172a" stroke="url(#crestGold)" stroke-width="2"/>
      <circle cx="-16" cy="88" r="6" fill="#38bdf8"/>
      <circle cx="-18" cy="86" r="2" fill="#ffffff"/>

      <circle cx="16" cy="88" r="11" fill="#0f172a" stroke="url(#crestGold)" stroke-width="2"/>
      <circle cx="16" cy="88" r="6" fill="#38bdf8"/>
      <circle cx="14" cy="86" r="2" fill="#ffffff"/>

      <!-- Bico em Diamante -->
      <polygon points="0,92 5,104 0,110 -5,104" fill="url(#crestGold)" stroke="#78350f" stroke-width="1"/>

      <!-- Asas Superiores Dinâmicas -->
      <path d="M -45,85 C -85,100 -105,140 -90,185 C -75,170 -50,165 -35,175" fill="none" stroke="url(#crestBlue)" stroke-width="2.5"/>
      <path d="M 45,85 C 85,100 105,140 90,185 C 75,170 50,165 35,175" fill="none" stroke="url(#crestBlue)" stroke-width="2.5"/>

      <!-- Ramo de Louro Inferior -->
      <path d="M -30,195 C 0,210 30,195 30,195" fill="none" stroke="url(#crestGold)" stroke-width="2.5"/>
    </g>

    <!-- Letras discretas PALAS em tipografia nobre -->
    <text x="0" y="215" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="700" letter-spacing="4" fill="#0f172a">
      PALAS
    </text>
  </g>
</svg>
