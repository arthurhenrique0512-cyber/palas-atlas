<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradientes Oficiais Palas Atlas -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="emblemTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <radialGradient id="emblemEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#021526"/>
    </radialGradient>

    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Círculo de fundo translúcido para integração com qualquer página -->
  <circle cx="300" cy="300" r="280" fill="#070c18" stroke="url(#emblemGold)" stroke-width="2.5" filter="url(#emblemShadow)"/>
  <circle cx="300" cy="300" r="268" fill="url(#emblemGlow)"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="256" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 7" opacity="0.6"/>

  <!-- Meridianos Orbitais do Atlas -->
  <ellipse cx="300" cy="300" rx="245" ry="95" fill="none" stroke="url(#emblemTeal)" stroke-width="1" opacity="0.35" transform="rotate(-20 300 300)"/>
  <ellipse cx="300" cy="300" rx="245" ry="95" fill="none" stroke="url(#emblemGold)" stroke-width="1" opacity="0.35" transform="rotate(20 300 300)"/>

  <!-- Tiques da Ocular do Microscópio -->
  <g stroke="url(#emblemGold)" stroke-width="1.5" opacity="0.75">
    <line x1="300" y1="22" x2="300" y2="38"/>
    <line x1="300" y1="562" x2="300" y2="578"/>
    <line x1="22" y1="300" x2="38" y2="300"/>
    <line x1="562" y1="300" x2="578" y2="300"/>
  </g>

  <!-- Louros de Palas Atena nas Bordas Inferiores -->
  <g fill="url(#emblemGold)" opacity="0.75" transform="translate(300, 300)">
    <g>
      <path d="M -135,160 C -155,120 -175,80 -185,40 C -175,60 -155,95 -125,120 Z"/>
      <path d="M -155,100 C -185,70 -200,30 -205,-10 C -190,15 -165,55 -140,75 Z"/>
      <path d="M -170,30 C -195,0 -205,-40 -202,-85 C -190,-50 -165,-15 -150,15 Z"/>
    </g>
    <g scale="-1, 1" transform="scale(-1, 1)">
      <path d="M -135,160 C -155,120 -175,80 -185,40 C -175,60 -155,95 -125,120 Z"/>
      <path d="M -155,100 C -185,70 -200,30 -205,-10 C -190,15 -165,55 -140,75 Z"/>
      <path d="M -170,30 C -195,0 -205,-40 -202,-85 C -190,-50 -165,-15 -150,15 Z"/>
    </g>
  </g>

  <!-- CORPO DA CORUJA DE PALAS -->
  <g transform="translate(300, 290) scale(0.92)" filter="url(#emblemShadow)">
    <!-- Escudo / Corpo com Geometria de Tecido -->
    <path d="M 0,15 L 60,55 L 80,155 L 0,230 L -80,155 L -60,55 Z" fill="#090f1d" stroke="url(#emblemGold)" stroke-width="2.5"/>

    <!-- Asas Estilizadas em Azul Petróleo -->
    <path d="M -60,55 C -115,35 -155,70 -190,125 C -165,130 -120,115 -80,155 Z" fill="url(#emblemTeal)" opacity="0.95"/>
    <path d="M 60,55 C 115,35 155,70 190,125 C 165,130 120,115 80,155 Z" fill="url(#emblemTeal)" opacity="0.95"/>
    <path d="M -80,155 C -125,160 -165,195 -195,240 C -165,230 -120,205 -65,200 Z" fill="#0369a1" opacity="0.85"/>
    <path d="M 80,155 C 125,160 165,195 195,240 C 165,230 120,205 65,200 Z" fill="#0369a1" opacity="0.85"/>

    <!-- Penas da Coroa / Plumas Auriculares -->
    <path d="M 0,-90 L 32,-150 L 45,-75 L 0,-60 Z" fill="url(#emblemGold)"/>
    <path d="M 0,-90 L -32,-150 L -45,-75 L 0,-60 Z" fill="url(#emblemGold)"/>

    <!-- Disco Facial -->
    <path d="M 0,-70 C 70,-100 105,-50 82,20 C 60,55 22,60 0,48 C -22,60 -60,55 -82,20 C -105,-50 -70,-100 0,-70 Z" fill="#080e1a" stroke="url(#emblemGold)" stroke-width="2.8"/>

    <!-- Sobrancelha Dourada e Crista Ateniense -->
    <path d="M 0,-50 L 52,-70 L 48,-48 L 0,-20 L -48,-48 L -52,-70 Z" fill="#fef08a"/>

    <!-- Olho Esquerdo (Ocular do Microscópio) -->
    <g transform="translate(-42, -10)">
      <circle cx="0" cy="0" r="30" fill="#030712" stroke="url(#emblemGold)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="20" fill="url(#emblemEye)"/>
      <circle cx="0" cy="0" r="8" fill="#020617"/>
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="-4" cy="-5" r="3" fill="#ffffff"/>
    </g>

    <!-- Olho Direito (Ocular do Microscópio) -->
    <g transform="translate(42, -10)">
      <circle cx="0" cy="0" r="30" fill="#030712" stroke="url(#emblemGold)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="20" fill="url(#emblemEye)"/>
      <circle cx="0" cy="0" r="8" fill="#020617"/>
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="-4" cy="-5" r="3" fill="#ffffff"/>
    </g>

    <!-- Bico Dourado em Faceta -->
    <polygon points="0,-20 9,25 0,45 -9,25" fill="url(#emblemGold)"/>

    <!-- Lâmina Microscópica nas Garras -->
    <g transform="translate(0, 230)">
      <rect x="-95" y="0" width="190" height="10" rx="2" fill="#0f172a" stroke="url(#emblemGold)" stroke-width="1.5"/>
      <line x1="-75" y1="5" x2="75" y2="5" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
      <path d="M -30,-6 L -25,3 L -18,-5 L -14,3 L -8,-6" fill="none" stroke="url(#emblemGold)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 30,-6 L 25,3 L 18,-5 L 14,3 L 8,-6" fill="none" stroke="url(#emblemGold)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
