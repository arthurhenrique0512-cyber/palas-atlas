<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="60%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="cardiacFiber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <filter id="heartShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fundo Orgânico Suave -->
  <path d="M 100,210 C 80,100 160,40 290,50 C 420,60 480,140 470,260 C 460,360 350,400 220,390 C 120,370 110,290 100,210 Z" fill="#fff1f2" fill-opacity="0.6"/>

  <!-- ============================================== -->
  <!-- 1. CORAÇÃO ANATÔMICO FLAT MINIMALISTA          -->
  <!-- ============================================== -->
  <g transform="translate(70, 100)" filter="url(#heartShadow)" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Vasos da Base (Aorta e Tronco Pulmonar) -->
    <!-- Artéria Aorta -->
    <path d="M 60,35 C 60,-15 110,-15 110,35" fill="none" stroke="#e11d48" stroke-width="18"/>
    <path d="M 60,35 C 60,-15 110,-15 110,35" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Tronco Pulmonar -->
    <path d="M 45,40 L 35,15" fill="none" stroke="#0284c7" stroke-width="14"/>
    <path d="M 45,40 L 35,15" fill="none" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Corpo Muscular do Coração (Ventrículos e Átrios) -->
    <path d="M 75,45 C 95,25 130,30 135,65 C 140,115 105,155 75,185 C 45,155 10,115 15,65 C 20,30 55,25 75,45 Z" fill="url(#heartGrad)"/>
    
    <!-- Sulco Interventricular Anterior com Vaso Sanguíneo -->
    <path d="M 72,55 C 65,95 78,135 75,185" fill="none" stroke="#be123c" stroke-width="2.5" stroke-dasharray="3 3"/>

    <!-- Ponto Alvo do Miocárdio (Área de Zoom) -->
    <circle cx="95" cy="115" r="10" fill="#38bdf8" fill-opacity="0.3"/>
    <circle cx="95" cy="115" r="4" fill="#0284c7"/>
  </g>

  <!-- Linhas Conectoras do Foco Óptico -->
  <path d="M 175,215 C 220,185 240,165 270,165" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- ============================================== -->
  <!-- 2. LENTE DE ZOOM: TECIDO MUSCULAR CARDÍACO     -->
  <!-- ============================================== -->
  <g transform="translate(365, 165)" filter="url(#heartShadow)">
    <!-- Moldura da Lente Circular -->
    <circle cx="0" cy="0" r="85" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="82" fill="#fff5f7"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#0284c7" stroke-width="3"/>

    <!-- FIBRAS MUSCULARES CARDÍACAS BIFURCADAS / RAMIFICADAS -->
    <g clip-path="url(#heartClip)" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <clipPath id="heartClip">
        <circle cx="0" cy="0" r="81"/>
      </clipPath>

      <!-- Fibra Superior que se Bifurca -->
      <path d="M -85,-35 L -10,-35 L 45,-55 L 85,-55" fill="none" stroke="#fda4af" stroke-width="22"/>
      <path d="M -10,-35 L 45,-15 L 85,-15" fill="none" stroke="#fda4af" stroke-width="22"/>
      
      <!-- Linhas de Contorno das Fibras -->
      <path d="M -85,-46 L -10,-46 L 45,-66 L 85,-66" fill="none"/>
      <path d="M -85,-24 L -10,-24 L 45,-4 L 85,-4" fill="none"/>
      <path d="M -10,-24 L 45,-44 L 85,-44" fill="none"/>

      <!-- Fibra Inferior Paralela -->
      <path d="M -85,35 L 85,35" fill="none" stroke="#fda4af" stroke-width="24"/>
      <path d="M -85,23 L 85,23" fill="none"/>
      <path d="M -85,47 L 85,47" fill="none"/>

      <!-- DISCOS INTERCALARES (JUNÇÕES ESCALERIFORMES TRANSVERSAIS) -->
      <!-- O marcador morfológico diagnóstico do músculo cardíaco -->
      <line x1="-35" y1="-46" x2="-35" y2="-24" stroke="#4c1d95" stroke-width="3.5"/>
      <line x1="25" y1="-66" x2="25" y2="-44" stroke="#4c1d95" stroke-width="3.5"/>
      <line x1="60" y1="-26" x2="60" y2="-4" stroke="#4c1d95" stroke-width="3.5"/>
      <line x1="-20" y1="23" x2="-20" y2="47" stroke="#4c1d95" stroke-width="3.5"/>
      <line x1="40" y1="23" x2="40" y2="47" stroke="#4c1d95" stroke-width="3.5"/>

      <!-- NÚCLEOS OVOIDES ÚNICOS E CENTRAIS -->
      <ellipse cx="-55" cy="-35" rx="10" ry="6" fill="#6b21a8"/>
      <ellipse cx="65" cy="-55" rx="8" ry="5.5" fill="#7e22ce"/>
      <ellipse cx="10" cy="35" rx="11" ry="6.5" fill="#6b21a8"/>
      <ellipse cx="-60" cy="35" rx="9" ry="6" fill="#7e22ce"/>

      <!-- Estriações Suaves -->
      <g stroke="#f43f5e" stroke-width="1" opacity="0.4">
        <line x1="-70" y1="-45" x2="-70" y2="-25"/><line x1="-60" y1="-45" x2="-60" y2="-25"/>
        <line x1="-15" y1="-45" x2="-15" y2="-25"/><line x1="5" y1="-45" x2="5" y2="-25"/>
        <line x1="-40" y1="24" x2="-40" y2="46"/><line x1="-30" y1="24" x2="-30" y2="46"/>
        <line x1="25" y1="24" x2="25" y2="46"/><line x1="60" y1="24" x2="60" y2="46"/>
      </g>
    </g>

    <!-- Reflexo de Vidro -->
    <path d="M -50,-50 C -20,-70 20,-70 50,-50 C 35,-60 -5,-65 -40,-50 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- ============================================== -->
  <!-- CARD FLUTUANTE ESTILO KENHUB                   -->
  <!-- ============================================== -->
  <g transform="translate(150, 315)" filter="url(#heartShadow)">
    <rect x="0" y="0" width="235" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="14" fill="#fff1f2"/>
    <!-- Ícone de Coração / Pulso -->
    <path d="M 23,26 L 26,26 L 28,21 L 30,31 L 32,26 L 35,26" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="52" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">
      Músculo Cardíaco
    </text>
    <text x="52" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">
      Discos Intercalares &amp; Fibras Ramificadas
    </text>
  </g>
</svg>
