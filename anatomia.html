<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Anatomia Macroscópica - Palas Atlas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Estilos e Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <!-- Firebase V8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }
  </style>
</head>

<body class="bg-neutral-950 w-screen h-screen overflow-hidden flex font-sans text-slate-300 selection:bg-neutral-800 selection:text-white">

  <!-- MENU LATERAL ESQUERDO: Regiões Topográficas -->
  <aside class="w-64 h-full bg-neutral-900 border-r border-neutral-800 flex flex-col z-40 shrink-0">
    <div class="p-6 border-b border-neutral-800">
      <a href="index.html" class="flex items-center gap-3 text-neutral-400 hover:text-white transition-colors no-underline">
        <img src="assets/logo-transparente.png?v=5" alt="Palas Atlas" class="h-6 w-auto object-contain brightness-110 drop-shadow-[0_0_8px_rgba(30,58,138,0.2)]" style="filter: hue-rotate(180deg) saturate(100%);" />
        <span class="font-serif tracking-widest text-sm uppercase">Palas Atlas</span>
      </a>
      <h2 class="text-xl font-bold text-white mt-6 tracking-tight">Anatomia</h2>
      <p class="text-xs text-neutral-500 mt-1 uppercase tracking-wider font-mono">Atlas de Dissecação</p>
    </div>
    
    <nav class="flex-1 overflow-y-auto p-4 space-y-2" id="navRegioes">
      <!-- Regiões geradas via JS -->
      <button data-regiao="cabeca" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Cabeça
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
      <button data-regiao="pescoco" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Pescoço
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
      <button data-regiao="torax" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Tórax
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
      <button data-regiao="membro-superior" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Membro Superior
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
      <button data-regiao="membro-inferior" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Membro Inferior
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
      <button data-regiao="abdome" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Abdome
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
      <button data-regiao="pelve" class="regiao-btn w-full text-left px-4 py-3 rounded-lg hover:bg-neutral-800/50 text-neutral-400 hover:text-white font-medium text-sm transition-colors cursor-pointer flex justify-between items-center group">
        Pelve
        <span class="text-neutral-600 group-hover:text-white opacity-0 group-hover:opacity-100">&rarr;</span>
      </button>
    </nav>
  </aside>

  <!-- ÁREA CENTRAL: Viewer de Dissecação -->
  <main class="flex-1 h-full flex flex-col bg-white overflow-hidden relative">
    
    <!-- Feedback de Carregamento / SPLASH SCREEN -->
    <div id="loaderImg" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-[99999] transition-opacity duration-1000">
      <video autoplay loop muted playsinline class="w-48 md:w-64 h-auto pointer-events-none object-contain mb-8 mix-blend-multiply">
        <source src="assets/logo-animada.webm" type="video/webm">
        <source src="assets/logo-animada.mp4" type="video/mp4">
      </video>
      <p class="text-xs text-neutral-800 tracking-wider font-mono uppercase font-semibold mb-4">Mapeando estruturas morfológicas...</p>
      <div class="w-48 h-[3px] bg-gray-200 rounded-full overflow-hidden relative">
        <div class="absolute top-0 left-0 h-full bg-slate-900 w-1/3 rounded-full animate-sweep"></div>
      </div>
    </div>

    <!-- MARCA D'ÁGUA NO CANVAS -->
    <img src="assets/logo-transparente.png?v=5" alt="Palas Atlas" class="absolute bottom-4 right-4 z-10 pointer-events-none select-none opacity-20 hover:opacity-40 transition-opacity h-6 w-auto" style="filter: brightness(0) invert(1);" />

    <div id="msgVazio" class="absolute inset-0 flex items-center justify-center text-neutral-500 text-sm font-mono text-center max-w-md mx-auto z-10">
      Selecione uma região topográfica no menu lateral para iniciar a exploração cadavérica.
    </div>
    
    <!-- Container de Rolagem Horizontal (Scroll Snap) -->
    <div id="carouselContainer" class="flex overflow-x-auto snap-x snap-mandatory scroll-smooth w-full h-full [&::-webkit-scrollbar]:hidden hidden">
      <!-- Páginas dinâmicas injetadas via JS -->
    </div>

    <!-- Botão Voltar ao Topo / Início -->
    <button id="btnBackToTop" onclick="document.getElementById('carouselContainer').scrollTo({ left: 0, behavior: 'smooth' })" class="fixed bottom-8 right-8 z-50 bg-neutral-800 hover:bg-neutral-700 text-white p-3 rounded-full shadow-lg border border-neutral-700 transition-all cursor-pointer opacity-0 pointer-events-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </button>
  </main>

  <script type="module" src="js/firebase-config.js?v=2026.99996"></script>
  <script type="module" src="js/anatomy-viewer.js?v=2026.99996"></script>
</body>
</html>
