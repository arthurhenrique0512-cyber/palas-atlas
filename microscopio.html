  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Prose do texto descritivo lateral (off-white + detalhes em ouro-champanhe) */
    .prose-atlas {
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .prose-atlas h3       { color:#f5f5f4; font-weight:700; font-size:1rem; margin-bottom:.5rem; }
    .prose-atlas p        { color:#d6d3d1; line-height:1.8; margin-bottom:1rem; }
    .prose-atlas strong   { color:#fafaf9; font-weight:600; }
    .prose-atlas blockquote { border: none !important; margin: 0 !important; padding: 0 !important; }
    .prose-atlas .pin-link {
      color: #c8ad5f;
      text-decoration: underline;
      text-decoration-color: rgba(200, 173, 95, 0.4);
      text-underline-offset: 3px;
      font-weight: 500;
      cursor: pointer;
      padding: 0 2px;
      transition: color .15s;
      white-space: normal;
    }
    .prose-atlas .pin-link:hover { color: #e0c97f; }

    /* Botão de recolher painel: preenchimento do painel indica estado aberto */
    .viewer-sidebar-toggle .sidebar-icon-fill { opacity: .35; transition: opacity .3s ease; }
    .viewer-sidebar-toggle[aria-expanded="false"] .sidebar-icon-fill { opacity: 0; }

    /* Logo do cabeçalho: ATLAS em ouro-champanhe discreto */
    header brand-logo span.font-normal { color: #c8ad5f !important; }

    /* Scrollbar minimalista */
    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }
  </style>
</head>

        onclick="if(document.referrer){window.history.back();}else{window.location.href='index.html';}"

        </svg>
      </button>
    </div>

        <button type="button" onclick="window.alterarZoom(1.35)" class="w-6 h-6 flex items-center justify-center rounded-lg text-neutral-400 hover:text-white hover:bg-white/[0.06] transition-all text-xs font-bold cursor-pointer" title="Aproximar (+)">+</button>

        <div class="w-px h-4 bg-white/[0.08]"></div>
